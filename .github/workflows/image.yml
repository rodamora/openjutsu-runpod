name: image

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/openjutsu-runpod
    steps:
      - uses: actions/checkout@v4

      # The CUDA torch layer alone is several GB; the stock runner disk is too small without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: CPU smoke (nodes register, app login gate, app -> ComfyUI -> proxy)
        run: docker run --rm "$IMAGE:${{ github.sha }}" /opt/openjutsu-runpod/smoke.sh

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
